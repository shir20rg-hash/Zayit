name: Build Limud Tracker APK
on:
  push:
    branches: [chatgpt/limud-tracker]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Rebuild source archive
        run: |
          cat limud-tracker/source.b64.000 limud-tracker/source.b64.001 limud-tracker/source.b64.01 limud-tracker/source.b64.02 limud-tracker/source.b64.03 limud-tracker/source.b64.04 | tr -d '\n\r' | base64 -d > /tmp/LimudTracker-source.zip
          test "$(stat -c%s /tmp/LimudTracker-source.zip)" = "22086"
          unzip -t /tmp/LimudTracker-source.zip
          mkdir -p .build-limud
          unzip -q /tmp/LimudTracker-source.zip -d .build-limud
          sed -i 's/[[:space:]]*android:localeConfig="@null"//' .build-limud/LimudTracker/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: .build-limud/LimudTracker
        run: gradle --no-daemon :app:assembleDebug
      - name: Prepare APK
        run: cp .build-limud/LimudTracker/app/build/outputs/apk/debug/app-debug.apk LimudTracker-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LimudTracker-APK
          path: LimudTracker-1.0.0.apk
          if-no-files-found: error
