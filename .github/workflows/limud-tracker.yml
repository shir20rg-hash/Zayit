name: Build Limud Tracker APK

on:
  push:
    branches:
      - chatgpt/limud-tracker
    paths:
      - 'limud-tracker/**'
      - '.github/workflows/limud-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract app source
        run: |
          rm -rf .build-limud
          mkdir -p .build-limud
          unzip -q limud-tracker/LimudTracker-source.zip -d .build-limud

      - name: Build debug APK
        working-directory: .build-limud/LimudTracker
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK
        run: cp .build-limud/LimudTracker/app/build/outputs/apk/debug/app-debug.apk LimudTracker-1.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LimudTracker-APK
          path: LimudTracker-1.0.0.apk
          if-no-files-found: error
